  <template id="tpl-fast">
    <section class="fast-page">
      <h1 class="fast-h1">The "perfect prompt" doesn't exist.</h1>

      <p>
        You'll see a lot of posts online that talk about the "perfect prompt." Forget those. You don't need that. What you need is a "good enough prompt" that focuses exactly on what <span class="gradient-text">YOU</span> need.
      </p>

      <p>Here's a framework I put together that you can use while prompting.</p>

      <ol class="fast-moves">
        <li class="fast-move">
          <h3 class="fast-move-title"><span class="fast-move-letter">F</span>rame</h3>
          <p class="fast-move-def">Set the role and the situation. What role is AI playing? What's the context?</p>
          <div class="fast-move-example">
            <span class="fast-move-tag">Example</span>
            <em>You are a senior instructional designer.</em>
          </div>
        </li>
        <li class="fast-move">
          <h3 class="fast-move-title"><span class="fast-move-letter">A</span>sk</h3>
          <p class="fast-move-def">The actual request. A single sentence with one action verb.</p>
          <div class="fast-move-example">
            <span class="fast-move-tag">Example</span>
            <em>Draft a module-by-module outline for a training program.</em>
          </div>
        </li>
        <li class="fast-move">
          <h3 class="fast-move-title"><span class="fast-move-letter">S</span>hape</h3>
          <p class="fast-move-def">Constraints, format, scope. The more you constrain, the better the output. Strong Shape sections always include explicit Don'ts.</p>
          <div class="fast-move-example">
            <span class="fast-move-tag">Example</span>
            <em>4 to 6 modules. Each needs an outcome with a Bloom-level verb. Don't pad with filler.</em>
          </div>
        </li>
        <li class="fast-move">
          <h3 class="fast-move-title"><span class="fast-move-letter">T</span>une</h3>
          <p class="fast-move-def">Tells AI to push back, flag assumptions, or disagree with you.</p>
          <div class="fast-move-example">
            <span class="fast-move-tag">Example</span>
            <em>State your assumptions, and ask any clarifying questions.</em>
          </div>
        </li>
      </ol>

      <div class="fast-intro">
        <img class="fast-intro-photo" src="/assets/avatar.jpg" alt="Fernando De Vega" />
        <div class="fast-intro-bubble">
          <p>FAST isn't the only model. There's CRAFT (Context, Role, Action, Format, Test), CO-STAR (Context, Objective, Style, Tone, Audience, Response), CRISPE, RTF. They all converge on similar ideas. I went with FAST because it's the shortest acronym I could find that still includes Tune. Tune is the move most people miss.</p>
        </div>
      </div>

    </section>
  </template>
